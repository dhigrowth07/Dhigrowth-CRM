services:
  wappilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wappilot-app
    restart: unless-stopped
    ports:
      - "80:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    env_file:
      - .env
    volumes:
      # Persist campaigns, tenants, subscriptions, and logs across container restarts
      - wappilot-data:/app/backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wappilot-data:
    driver: local
